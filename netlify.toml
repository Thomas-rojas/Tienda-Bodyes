# Despliegue del frontend CLIO (Vite + React)
# Repo monorepo: frontend en FRONDEND_BODYES (typo histórico, no usar FRONTEND_BODYES).

[build]
  command = "npm ci --prefix FRONDEND_BODYES && npm run build --prefix FRONDEND_BODYES"
  publish = "FRONDEND_BODYES/dist"

[build.environment]
  NODE_VERSION = "20"

# React Router: todas las rutas sirven index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
