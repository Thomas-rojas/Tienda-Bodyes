# Blueprint Render — backend CLIO (monorepo)
# Conectar en https://dashboard.render.com/blueprints

services:
  - type: web
    name: clio-bodyes-api
    runtime: node
    rootDir: BACKEND_BODYES
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://tiendaclio.netlify.app
      - key: BACKEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: MERCADOPAGO_ENV
        value: test
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_PUBLIC_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_DOCUMENT_NUMBER
        value: "1000000001"
      - key: STORE_EMAIL
        sync: false
      - key: STORE_WHATSAPP
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
